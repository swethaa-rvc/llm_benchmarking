# Runs the benchmark REST service with .env always loaded.
#
#   docker compose up -d --build     start, rebuilding the image if code changed
#   docker compose logs -f           watch a run
#   docker compose down              stop and remove the container
#
# After editing .env, run `docker compose up -d` again. Compose recreates the
# container so it picks up the new values.

services:
  benchmark:
    build: .
    image: llm-ops-benchmark
    container_name: llm-ops-benchmark
    env_file: .env                         # judge settings + API keys; required
    environment:
      AGENT_HOST: host.docker.internal     # agents run on this machine, not in Docker
    extra_hosts:
      - "host.docker.internal:host-gateway"  # needed on Linux; harmless on Docker Desktop
    ports:
      - "8000:8000"
    volumes:
      - ./benchmark.db:/app/benchmark.db   # run history - must exist as a file first
      - ./results:/app/results             # JSON/CSV snapshots
    restart: unless-stopped
